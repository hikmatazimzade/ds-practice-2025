version: '3'
services:
  frontend:
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./frontend/src:/usr/share/nginx/html

  orchestrator:
    build:
      context: ./
      dockerfile: ./orchestrator/Dockerfile
    ports:
      - 8081:5000
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/orchestrator/src/app.py
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    volumes:
      - ./utils:/app/utils
      - ./orchestrator/src:/app/orchestrator/src

  fraud_detection:
    build:
      context: ./
      dockerfile: ./fraud_detection/Dockerfile
    ports:
      - 50051:50051
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/fraud_detection/src/app.py
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    volumes:
      - ./utils:/app/utils
      - ./fraud_detection/src:/app/fraud_detection/src

  suggestions:
    build:
      context: ./
      dockerfile: ./suggestions/Dockerfile
    ports:
      - 50053:50053
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/suggestions/src/app.py
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    volumes:
      - ./utils:/app/utils
      - ./suggestions/src:/app/suggestions/src

  transaction_verification:
    build:
      context: ./
      dockerfile: ./transaction_verification/Dockerfile
    ports:
      - 50052:50052
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/transaction_verification/src/app.py
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    volumes:
      - ./utils:/app/utils
      - ./transaction_verification/src:/app/transaction_verification/src

  order_queue:
    build:
      context: ./
      dockerfile: ./order_queue/Dockerfile
    ports:
      - 50055:50055
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/order_queue/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./order_queue/src:/app/order_queue/src

  order_executor_1:
    build:
      context: ./
      dockerfile: ./order_executor/Dockerfile
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/order_executor/src/app.py
      - REPLICA_ID=1
      - ALL_REPLICAS=1:order_executor_1:50056,2:order_executor_2:50056,3:order_executor_3:50056
    volumes:
      - ./utils:/app/utils
      - ./order_executor/src:/app/order_executor/src
    depends_on:
      - order_queue

  order_executor_2:
    build:
      context: ./
      dockerfile: ./order_executor/Dockerfile
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/order_executor/src/app.py
      - REPLICA_ID=2
      - ALL_REPLICAS=1:order_executor_1:50056,2:order_executor_2:50056,3:order_executor_3:50056
    volumes:
      - ./utils:/app/utils
      - ./order_executor/src:/app/order_executor/src
    depends_on:
      - order_queue

  order_executor_3:
    build:
      context: ./
      dockerfile: ./order_executor/Dockerfile
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/order_executor/src/app.py
      - REPLICA_ID=3
      - ALL_REPLICAS=1:order_executor_1:50056,2:order_executor_2:50056,3:order_executor_3:50056
    volumes:
      - ./utils:/app/utils
      - ./order_executor/src:/app/order_executor/src
    depends_on:
      - order_queue

  books_database_1:
    build:
      context: ./
      dockerfile: ./books_database/Dockerfile
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/books_database/src/app.py
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - REPLICA_ID=1
      - ALL_REPLICAS=1:books_database_1:50057,2:books_database_2:50057,3:books_database_3:50057
    volumes:
      - ./utils:/app/utils
      - ./books_database/src:/app/books_database/src

  books_database_2:
    build:
      context: ./
      dockerfile: ./books_database/Dockerfile
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/books_database/src/app.py
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - REPLICA_ID=2
      - ALL_REPLICAS=1:books_database_1:50057,2:books_database_2:50057,3:books_database_3:50057
    volumes:
      - ./utils:/app/utils
      - ./books_database/src:/app/books_database/src

  books_database_3:
    build:
      context: ./
      dockerfile: ./books_database/Dockerfile
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/books_database/src/app.py
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - REPLICA_ID=3
      - ALL_REPLICAS=1:books_database_1:50057,2:books_database_2:50057,3:books_database_3:50057
    volumes:
      - ./utils:/app/utils
      - ./books_database/src:/app/books_database/src
 
  payment:
      build:
        context: ./
        dockerfile: ./payment/Dockerfile
      container_name: payment_service
      ports:
        - "45060:50060"
      environment:
        - PYTHONUNBUFFERED=TRUE
        - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      volumes:
        - ./utils:/app/utils
        - ./payment/src:/app/payment/src

  observability:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=1000
