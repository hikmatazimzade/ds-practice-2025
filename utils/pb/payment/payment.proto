syntax = "proto3";

package payment;

service PaymentService {
  rpc Prepare (PaymentRequest) returns (PrepareResponse);
  rpc Commit (TransactionId) returns (Empty);
  rpc Abort (TransactionId) returns (Empty);
}

message PaymentRequest {
  string transaction_id = 1;
  float amount = 2;
  string user_id = 3;
}

message PrepareResponse {
  bool ok = 1;
}

message TransactionId {
  string id = 1;
}

message Empty {}